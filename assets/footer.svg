<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" width="800" height="80">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;fill:#8b949e;white-space:pre}
@media (prefers-color-scheme: light){text{fill:#57606a}}
.R{animation:rr 16s linear infinite}.L{animation:ll 16s linear infinite}
@keyframes rr{0%{transform:translateX(30px);opacity:1}45%{transform:translateX(690px);opacity:1}46%,100%{transform:translateX(690px);opacity:0}}
@keyframes ll{0%,50%{transform:translateX(690px);opacity:0}51%{transform:translateX(690px);opacity:1}95%{transform:translateX(30px);opacity:1}96%,100%{transform:translateX(30px);opacity:0}}
.hop{animation:hp .5s ease-in-out infinite alternate}
@keyframes hp{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.f{animation:a .4s steps(1) infinite}.f2{animation:b .4s steps(1) infinite}
@keyframes a{0%{opacity:1}50%{opacity:0}}@keyframes b{0%{opacity:0}50%{opacity:1}}
</style>
<g class="R"><g class="hop"><g transform="translate(0,22)"><text class="f" xml:space="preserve"><tspan x="0" dy="0">  (\_/)</tspan><tspan x="0" dy="16"> ( o.o)</tspan><tspan x="0" dy="16"> c(")(")</tspan></text><text class="f2" xml:space="preserve"><tspan x="0" dy="0">  (\_/)</tspan><tspan x="0" dy="16"> ( o.o)</tspan><tspan x="0" dy="16">  (")(")</tspan></text></g></g></g>
<g class="L"><g class="hop"><g transform="translate(0,22)"><text class="f" xml:space="preserve"><tspan x="0" dy="0">  (\_/)</tspan><tspan x="0" dy="16"> (o.o )</tspan><tspan x="0" dy="16"> (")(")c</tspan></text><text class="f2" xml:space="preserve"><tspan x="0" dy="0">  (\_/)</tspan><tspan x="0" dy="16"> (o.o )</tspan><tspan x="0" dy="16"> (")(") </tspan></text></g></g></g>
</svg>